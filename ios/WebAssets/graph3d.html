<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>GraphRecall 3D Graph</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #07080E;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #graph { position: absolute; inset: 0; }
    #graph canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .label {
      position: absolute; left: 0; top: 0; display: none;
      white-space: nowrap; will-change: transform;
      font-size: 9.5px; font-weight: 500; letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.86);
      background: none; border: none; padding: 0;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.98), 0 0 6px rgba(0, 0, 0, 0.95);
    }
    .label.neighbor {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.96);
    }
    .label.selected {
      font-size: 11.5px;
      font-weight: 700;
      color: #B6FF2E;
      z-index: 4;
    }
    .cluster-label {
      position: absolute; left: 0; top: 0;
      white-space: nowrap; will-change: transform, opacity;
      font: 600 10px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      letter-spacing: 0.06em; text-transform: uppercase;
      background: none; border: none; padding: 4px 6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 1), 0 0 10px rgba(0, 0, 0, 0.95);
      pointer-events: auto;
      cursor: pointer;
      z-index: 3;
    }
    #status {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.55); font-size: 12px; letter-spacing: 0.02em;
      pointer-events: none; display: none;
    }
    #status.show { display: block; }
  </style>
</head>
<body>
  <div id="graph"></div>
  <div id="labels"></div>
  <div id="status"></div>
  <script src="graph3d.bundle.js"></script>
</body>
</html>
