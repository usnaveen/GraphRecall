<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>GraphRecall 3D Graph</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #graph { position: absolute; inset: 0; }
    #graph canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .label {
      position: absolute; left: 0; top: 0; display: none;
      white-space: nowrap; will-change: transform;
      font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.85);
    }
    .label.neighbor { color: rgba(255, 255, 255, 0.95); }
    .label.selected { color: #B6FF2E; font-size: 13px; font-weight: 700; }
    #status {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.55); font-size: 12px; letter-spacing: 0.02em;
      pointer-events: none; display: none;
    }
    #status.show { display: block; }
  </style>
</head>
<body>
  <div id="graph"></div>
  <div id="labels"></div>
  <div id="status"></div>
  <script src="graph3d.bundle.js"></script>
</body>
</html>
