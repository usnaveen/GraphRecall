<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>GraphRecall 3D Graph</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #graph { position: absolute; inset: 0; }
    #graph canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .label {
      position: absolute; left: 0; top: 0; display: none;
      white-space: nowrap; will-change: transform;
      font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.90);
      background: rgba(10, 12, 20, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 7px;
      padding: 2px 7px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .label.neighbor {
      color: rgba(255, 255, 255, 0.96);
      border-color: rgba(255, 255, 255, 0.22);
    }
    .label.selected {
      color: #B6FF2E;
      font-size: 13px;
      font-weight: 700;
      border-color: rgba(182, 255, 46, 0.45);
      background: rgba(12, 16, 22, 0.94);
      z-index: 4;
    }
    .cluster-label {
      position: absolute; left: 0; top: 0;
      white-space: nowrap; will-change: transform, opacity;
      font: 700 10px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      letter-spacing: 0.05em; text-transform: uppercase;
      background: rgba(10, 12, 22, 0.88);
      border-radius: 999px;
      padding: 3px 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      cursor: pointer;
      z-index: 3;
    }
    #status {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.55); font-size: 12px; letter-spacing: 0.02em;
      pointer-events: none; display: none;
    }
    #status.show { display: block; }
  </style>
</head>
<body>
  <div id="graph"></div>
  <div id="labels"></div>
  <div id="status"></div>
  <script src="graph3d.bundle.js"></script>
</body>
</html>
