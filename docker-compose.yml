# Local GraphRecall stack: API + Postgres (pgvector) + Neo4j.
#
#   docker compose up --build        start everything (Ctrl+C to stop)
#   docker compose up -d             start in the background
#   docker compose logs -f api       follow API logs
#   docker compose down              stop (data is kept in named volumes)
#   docker compose down -v           stop AND delete all local data
#
# Secrets (GOOGLE_API_KEY, …) come from .env — copy .env.example to start.

name: graphrecall

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: graphrecall
      POSTGRES_PASSWORD: graphrecall
      POSTGRES_DB: graphrecall
    ports:
      - "5432:5432"            # so you can inspect data with psql / TablePlus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrecall -d graphrecall"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/graphrecall-dev
      # Docker Desktop gets ~4 GB here; keep Neo4j modest.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"            # Neo4j Browser: http://localhost:7474
      - "7687:7687"            # Bolt protocol (what the API uses)
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphrecall-dev 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  api:
    build: .
    env_file: .env
    environment:
      # Inside the compose network, services reach each other by service name.
      DATABASE_URL: postgresql://graphrecall:graphrecall@postgres:5432/graphrecall
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphrecall-dev
      ENVIRONMENT: development
      # DEBUG=true makes the backend accept the bearer token "test-token" as a test user.
      DEBUG: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend   # live code: edits reload without rebuilding
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  pgdata:
  neo4jdata:
